services:
  app1:
    build: ./backend
    environment: { NAME: app1 }
  app2:
    build: ./backend
    environment: { NAME: app2 }
  app3:
    build: ./backend
    environment: { NAME: app3 }

  nginx:
    image: nginx:1.27-alpine
    depends_on: [app1, app2, app3]
    ports:
      - "8080:8080"   # reverse proxy  -> app1
      - "8081:8081"   # round robin LB -> app1,2,3
      - "8082:8082"   # weighted LB
      - "8083:8083"   # least_conn LB
      - "8084:8084"   # ip_hash (sticky)
      - "8085:8085"   # path-based routing + failover
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
