events {}

http {
  # Show which backend served each request in nginx logs: `docker compose logs -f nginx`
  log_format demo '$remote_addr "$request" -> $status upstream=$upstream_addr time=$request_time';
  access_log /dev/stdout demo;

  # Docker's internal DNS; lets nginx resolve app1/app2/app3
  resolver 127.0.0.11 valid=10s;

  # ---------------------------------------------------------------
  # UPSTREAMS = named groups of backend servers
  # ---------------------------------------------------------------
  # Default method: round robin (1,2,3,1,2,3...)
  upstream rr_pool {
    server app1:3000;
    server app2:3000;
    server app3:3000;
  }

  # Weighted: app1 gets 3 of every 5 requests, app2 gets 1, app3 gets 1
  upstream weighted_pool {
    server app1:3000 weight=3;
    server app2:3000 weight=1;
    server app3:3000 weight=1;
  }

  # least_conn: next request goes to the server with fewest active connections
  upstream leastconn_pool {
    least_conn;
    server app1:3000;
    server app2:3000;
    server app3:3000;
  }

  # ip_hash: same client IP always hits the same backend (sticky sessions)
  upstream iphash_pool {
    ip_hash;
    server app1:3000;
    server app2:3000;
    server app3:3000;
  }

  # Failover: after 2 failures within 10s, a server is skipped for 10s.
  # app3 is a `backup`: only used if app1 and app2 are both down.
  upstream failover_pool {
    server app1:3000 max_fails=2 fail_timeout=10s;
    server app2:3000 max_fails=2 fail_timeout=10s;
    server app3:3000 backup;
  }

  # ---------------------------------------------------------------
  # 1) REVERSE PROXY (:8080) -> a single backend
  # ---------------------------------------------------------------
  server {
    listen 8080;

    location / {
      proxy_pass http://app1:3000;

      # Pass original client info to the backend (otherwise it only sees nginx)
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }


  # ---------------------------------------------------------------
  # 2) LOAD BALANCERS: same server block, different upstream
  # ---------------------------------------------------------------
  server {
    listen 8081;                       # round robin
    location / { proxy_pass http://rr_pool; include /etc/nginx/proxy_headers.conf; }
  }
  server {
    listen 8082;                       # weighted
    location / { proxy_pass http://weighted_pool; include /etc/nginx/proxy_headers.conf; }
  }
  server {
    listen 8083;                       # least_conn
    location / { proxy_pass http://leastconn_pool; include /etc/nginx/proxy_headers.conf; }
  }
  server {
    listen 8084;                       # ip_hash
    location / { proxy_pass http://iphash_pool; include /etc/nginx/proxy_headers.conf; }
  }

  # ---------------------------------------------------------------
  # 3) PATH-BASED ROUTING + FAILOVER (:8085)
  # ---------------------------------------------------------------
  server {
    listen 8085;

    # /api/... goes to app2 only, with the /api prefix stripped
    # (trailing slash on proxy_pass URI replaces the matched prefix)
    location /api/ {
      proxy_pass http://app2:3000/;
      include /etc/nginx/proxy_headers.conf;
    }

    # Everything else uses the failover pool.
    # proxy_next_upstream retries the NEXT server on error/5xx, so
    # the client never sees /fail from a broken server if another is healthy.
    location / {
      proxy_pass http://failover_pool;
      proxy_next_upstream error timeout http_500 http_502 http_503;
      proxy_connect_timeout 2s;
      include /etc/nginx/proxy_headers.conf;
    }
  }
}
